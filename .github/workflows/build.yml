name: Build Nitrous

on:
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "staging" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore NuGet Dependencies
      run: dotnet restore App/Nitrous.csproj --runtime win-x64 --verbosity normal

    - name: Build Solution
      run: dotnet build App/Nitrous.csproj --configuration Release --no-restore

    - name: Publish Windows Executable
      run: >
        dotnet publish App/Nitrous.csproj
        --configuration Release
        --no-restore
        --runtime win-x64
        --self-contained false
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        --output ./publish

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Nitrous-Win64-Release
        path: ./publish/
        if-no-files-found: error
        retention-days: 14
